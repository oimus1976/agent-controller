name: cloudflare-poc-tests

on:
  pull_request:
    paths:
      - "cloudflare_poc/**"
      - ".github/workflows/cloudflare-poc-tests.yml"

permissions:
  contents: read

jobs:
  workers-vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare_poc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare_poc/package.json
      - run: npm install --ignore-scripts
      - run: npm test
