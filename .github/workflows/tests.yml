name: deterministic-tests

on:
  push:
    branches:
      - phase-4c-pn1-provider-neutral-proof
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run deterministic suite
        run: python -m unittest discover -s tests -v

  windows-junction:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run real Windows junction containment regression
        run: python -m unittest discover -s tests -p "test_antigravity_windows_junction.py" -v
      - name: Run real Windows PowerShell 5.1 AST producer regressions
        run: python -m unittest discover -s tests -p "test_private_ci_ast_producer_windows.py" -v
      - name: Run real Windows PowerShell 5.1 Phase 4 target-probe regressions
        run: python -m unittest discover -s tests -p "test_private_ci_phase4_target_probe_windows.py" -v
      - name: Run real Windows PowerShell 5.1 Phase 4 candidate regressions
        run: python -m unittest discover -s tests -p "test_private_ci_phase4_candidate_windows.py" -v
      - name: Run real Windows PowerShell 5.1 Phase 5 candidate regressions
        run: python -m unittest discover -s tests -p "test_private_ci_phase5_candidate_windows.py" -v
      - name: Run real Windows PowerShell 5.1 Phase 5 authority regressions
        run: python -m unittest discover -s tests -p "test_private_ci_phase5_authority_windows.py" -v
      - name: Run real Windows PowerShell 5.1 Phase 4 authority regressions
        run: python -m unittest discover -s tests -p "test_private_ci_phase4_authority_windows.py" -v
      - name: Run real Windows PowerShell 5.1 approval issuer regressions
        run: python -m unittest discover -s tests -p "test_private_ci_approval_issuer_windows.py" -v
      - name: Run real Windows PowerShell 5.1 consumption helper regressions
        run: python -m unittest discover -s tests -p "test_private_ci_consumption_helper_windows.py" -v
      - name: Run burned evidence archive UAC bridge parser regression
        run: python -m unittest discover -s tests -p "test_private_ci_burned_evidence_archive_windows.py" -v
      - name: Run real Windows native-output decoding regressions
        run: python -m unittest discover -s tests -p "test_private_ci_native_output_windows.py" -v
