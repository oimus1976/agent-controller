name: deterministic-tests

on:
  push:
    branches:
      - phase-4c-pn1-provider-neutral-proof
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic suite
        run: python -m unittest discover -s tests -v
