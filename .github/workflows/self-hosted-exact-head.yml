name: self-hosted-exact-head-fallback

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR number
        required: true
        type: string
      target_sha:
        description: Exact current 40-hex PR head SHA
        required: true
        type: string
      runner_nonce:
        description: One-time 16-hex nonce used to bind runner and disposable target identity
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  windows-exact-head:
    runs-on: ac-ci-${{ inputs.runner_nonce }}
    timeout-minutes: 10

    steps:
      - name: Preflight trusted control and disposable target identities
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          INPUT_RUNNER_NONCE: ${{ inputs.runner_nonce }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          RUNNER_OS_NAME: ${{ runner.os }}
          RUNNER_ARCH_NAME: ${{ runner.arch }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:WORKFLOW_REF -ne 'refs/heads/main') {
            throw 'fallback workflow must be dispatched from the trusted main branch'
          }
          if ($env:RUNNER_OS_NAME -ne 'Windows') {
            throw "runner OS must be Windows, got $env:RUNNER_OS_NAME"
          }
          if ($env:RUNNER_ARCH_NAME -ne 'X64') {
            throw "runner architecture must be X64, got $env:RUNNER_ARCH_NAME"
          }
          if ($env:INPUT_PR_NUMBER -notmatch '^[1-9][0-9]*$') {
            throw 'pr_number must be a positive decimal integer'
          }
          if ($env:INPUT_TARGET_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'target_sha must be exactly 40 hexadecimal characters'
          }
          if ($env:INPUT_RUNNER_NONCE -notmatch '^[0-9a-fA-F]{16}$') {
            throw 'runner_nonce must be exactly 16 hexadecimal characters'
          }

          $adminSid = 'S-1-5-32-544'
          $currentIdentity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $controlUser = Get-LocalUser -Name 'ac-runner' -ErrorAction Stop
          $controlSid = $controlUser.SID.Value
          if ($currentIdentity.User.Value -ne $controlSid) {
            throw "runner identity SID must equal local ac-runner SID; current=$($currentIdentity.User.Value) expected=$controlSid"
          }
          $tokenGroupSids = @($currentIdentity.Groups | ForEach-Object { $_.Value })
          if ($tokenGroupSids -contains $adminSid) {
            throw 'runner control identity carries local Administrators SID in its token'
          }
          $adminGroup = Get-LocalGroup -SID $adminSid -ErrorAction Stop
          $adminMemberSids = @(Get-LocalGroupMember -Group $adminGroup -ErrorAction Stop | ForEach-Object { $_.SID.Value })
          if ($adminMemberSids -contains $controlSid) {
            throw 'local ac-runner account must not be a member of local Administrators'
          }

          $targetName = "act-$($env:INPUT_RUNNER_NONCE.ToLowerInvariant())"
          if ($targetName.Length -ne 20) { throw 'derived disposable target account name must be exactly 20 characters' }
          $targetUser = Get-LocalUser -Name $targetName -ErrorAction Stop
          if (-not $targetUser.Enabled) { throw 'disposable target account is disabled' }
          $targetSid = $targetUser.SID.Value
          if ($targetSid -eq $controlSid) { throw 'control and target identities must have distinct SIDs' }
          if ($adminMemberSids -contains $targetSid) {
            throw 'disposable target account must not be a member of local Administrators'
          }

          $allTargetUsers = @(Get-LocalUser | Where-Object { $_.Name -like 'act-*' })
          if ($allTargetUsers.Count -ne 1 -or $allTargetUsers[0].SID.Value -ne $targetSid) {
            throw 'exactly one current disposable act-* target account may exist before a pilot'
          }
          $existingTargetProfiles = @(Get-CimInstance Win32_UserProfile -ErrorAction Stop | Where-Object { $_.SID -eq $targetSid })
          if ($existingTargetProfiles.Count -ne 0) {
            throw 'disposable target SID already has a Windows profile; target state is not fresh'
          }
          $targetTasks = @(Get-ScheduledTask -ErrorAction Stop | Where-Object {
            $_.Principal.UserId -eq $targetSid -or $_.Principal.UserId -eq "$env:COMPUTERNAME\$targetName"
          })
          if ($targetTasks.Count -ne 0) {
            throw 'disposable target SID already owns scheduled-task state'
          }

          $forbiddenControlState = @(
            (Join-Path $HOME '.ssh'),
            (Join-Path $HOME '.aws'),
            (Join-Path $HOME '.azure'),
            (Join-Path $HOME '.gemini'),
            (Join-Path $HOME '.codex'),
            (Join-Path $HOME '.config\gh')
          )
          foreach ($path in $forbiddenControlState) {
            if (Test-Path -LiteralPath $path) {
              throw "runner control profile contains forbidden credential/provider state: $path"
            }
          }

          $trustedPython = 'C:\Program Files\Python312\python.exe'
          $trustedGit = 'C:\Program Files\Git\cmd\git.exe'
          foreach ($tool in @($trustedPython, $trustedGit)) {
            if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) {
              throw "trusted machine-wide tool is missing: $tool"
            }
          }
          & $trustedPython -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'trusted Python major/minor must be exactly 3.12' }

          $credentialRoot = 'C:\ProgramData\AgentController\ci-secrets'
          $credentialFile = Join-Path $credentialRoot "$($env:INPUT_RUNNER_NONCE.ToLowerInvariant()).txt"
          if (-not (Test-Path -LiteralPath $credentialFile -PathType Leaf)) {
            throw 'one-time disposable-target credential file is missing'
          }
          $credentialAcl = Get-Acl -LiteralPath $credentialFile
          if (-not $credentialAcl.AreAccessRulesProtected) {
            throw 'one-time credential ACL must disable inheritance'
          }
          # Only the provisioning administrators own this file. The control SID
          # needs Read + Delete (Synchronize is added by Windows), never Write.
          $credentialOwner = $credentialAcl.GetOwner([Security.Principal.SecurityIdentifier]).Value
          if ($credentialOwner -notin @('S-1-5-18', $adminSid)) { throw 'unsafe credential owner' }
          $credentialRequired = [Security.AccessControl.FileSystemRights]'Read, Delete'
          $credentialAllowed = $credentialRequired -bor [Security.AccessControl.FileSystemRights]::Synchronize
          $controlCredentialRights = 0
          foreach ($rule in $credentialAcl.Access) {
            $ruleSid = $rule.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
            if ($rule.IsInherited -or $rule.InheritanceFlags -ne 'None' -or $rule.PropagationFlags -ne 'None' -or $rule.AccessControlType -ne 'Allow') {
              throw 'one-time credential ACL contains an unsupported ACE'
            }
            if ($ruleSid -notin @('S-1-5-18', $adminSid, $controlSid)) {
              throw "one-time credential file grants access to forbidden SID: $ruleSid"
            }
            if ($ruleSid -eq $controlSid) {
              if (($rule.FileSystemRights -band (-bnot $credentialAllowed)) -ne 0) { throw 'excess credential authority for ac-runner SID' }
              $controlCredentialRights = $controlCredentialRights -bor $rule.FileSystemRights
            }
          }
          if (($controlCredentialRights -band $credentialRequired) -ne $credentialRequired) {
            throw 'one-time credential file must explicitly permit Read and Delete for ac-runner SID'
          }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:EXPECTED_REPOSITORY/pulls/$env:INPUT_PR_NUMBER"
          $pr = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          if ($pr.state -ne 'open') { throw 'target PR is not open' }
          if ($null -eq $pr.head -or $null -eq $pr.head.repo) { throw 'target PR head repository evidence is missing' }
          if ($pr.head.repo.full_name -ne $env:EXPECTED_REPOSITORY) { throw 'fork or foreign head repository is not allowed' }
          if ($pr.head.sha -ne $env:INPUT_TARGET_SHA.ToLowerInvariant()) { throw 'target_sha is not the current PR head' }

          # This is intentionally the final trusted preflight gate before
          # actions/checkout(clean: true). Walk the lexical workspace path
          # upward and reject every existing reparse point before checkout can
          # mutate a redirected destination. Missing leaf components are safe
          # only when their existing ancestors are ordinary directories.
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE) -or -not [IO.Path]::IsPathRooted($env:GITHUB_WORKSPACE)) {
            throw 'GITHUB_WORKSPACE must be a non-empty rooted path before checkout'
          }
          $workspacePath = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $workspaceCursor = [IO.DirectoryInfo]::new($workspacePath)
          while ($null -ne $workspaceCursor) {
            if (Test-Path -LiteralPath $workspaceCursor.FullName -ErrorAction Stop) {
              $workspaceItem = Get-Item -LiteralPath $workspaceCursor.FullName -Force -ErrorAction Stop
              if (-not $workspaceItem.PSIsContainer) {
                throw "pre-check workspace path component is not a directory: $($workspaceCursor.FullName)"
              }
              if ($workspaceItem.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw "pre-check workspace reparse point: $($workspaceCursor.FullName)"
              }
            }
            $workspaceCursor = $workspaceCursor.Parent
          }

          "validated_control_sid=$controlSid"
          "validated_target_name=$targetName"
          "validated_target_sid=$targetSid"
          "validated_pr=$($pr.number)"
          "validated_head=$($pr.head.sha)"
          "validated_head_repo=$($pr.head.repo.full_name)"
          "validated_runner_os=$env:RUNNER_OS_NAME"
          "validated_runner_arch=$env:RUNNER_ARCH_NAME"
          "validated_workspace_path=$workspacePath"

      - name: Checkout exact target SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.target_sha }}
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean checkout and grant target read-only access
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          INPUT_RUNNER_NONCE: ${{ inputs.runner_nonce }}
        run: |
          $ErrorActionPreference = 'Stop'
          $trustedGit = 'C:\Program Files\Git\cmd\git.exe'
          $trustedPython = 'C:\Program Files\Python312\python.exe'
          $head = (& $trustedGit rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'git rev-parse failed' }
          if ($head -ne $env:INPUT_TARGET_SHA.ToLowerInvariant()) { throw "checkout HEAD mismatch: $head" }
          $dirty = @(& $trustedGit status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw 'git status failed' }
          if ($dirty.Count -ne 0) { throw 'working tree is not clean before tests' }
          & $trustedPython -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
          if ($LASTEXITCODE -ne 0) { throw 'trusted Python major/minor must be exactly 3.12' }

          $targetName = "act-$($env:INPUT_RUNNER_NONCE.ToLowerInvariant())"
          $targetSid = (Get-LocalUser -Name $targetName -ErrorAction Stop).SID.Value
          $controlSid = (Get-LocalUser -Name 'ac-runner' -ErrorAction Stop).SID.Value
          $systemSid = 'S-1-5-18'
          $adminSid = 'S-1-5-32-544'
          # Inventory without following links, including hidden .git children.
          # Inspect ancestors too: a normal leaf beneath a junction is not safe.
          function Assert-CheckoutItem($path) {
            $item = Get-Item -LiteralPath $path -Force -ErrorAction Stop
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw "checkout reparse point: $path" }
            return $item
          }
          $ancestor = Assert-CheckoutItem $env:GITHUB_WORKSPACE
          while ($null -ne $ancestor.Parent) { $ancestor = Assert-CheckoutItem $ancestor.Parent.FullName }
          $items = [Collections.Generic.List[object]]::new()
          $pending = [Collections.Generic.Stack[string]]::new()
          $pending.Push($env:GITHUB_WORKSPACE)
          while ($pending.Count -gt 0) {
            $item = Assert-CheckoutItem $pending.Pop()
            $items.Add($item)
            if ($item.PSIsContainer) {
              foreach ($child in @(Get-ChildItem -LiteralPath $item.FullName -Force -ErrorAction Stop)) {
                $pending.Push($child.FullName)
              }
            }
          }
          $accessSection = [Security.AccessControl.AccessControlSections]::Access
          $targetDenied = '0x{0:x}' -f [int][Security.AccessControl.FileSystemRights]'Write, Delete, DeleteSubdirectoriesAndFiles, ChangePermissions, TakeOwnership'
          # No inheritable ACEs: every existing object gets its own complete DACL.
          $checkoutSddl = "D:P(D;;$targetDenied;;;$targetSid)(A;;FA;;;$systemSid)(A;;FA;;;$adminSid)(A;;FA;;;$controlSid)(A;;FRFX;;;$targetSid)"
          $checkoutSddl = [Security.AccessControl.RawSecurityDescriptor]::new($checkoutSddl).GetSddlForm($accessSection)
          # Children first prevents parent replacement from stripping the only
          # inherited cleanup grants on a not-yet-hardened child.
          for ($index = $items.Count - 1; $index -ge 0; $index--) {
            $item = Assert-CheckoutItem $items[$index].FullName
            $acl = Get-Acl -LiteralPath $item.FullName -ErrorAction Stop
            $ownerSid = $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
            if ($ownerSid -notin @($systemSid, $adminSid, $controlSid)) { throw "unsafe checkout owner: $($item.FullName)" }
            # Persist only the DACL, never copied owner/audit state requiring
            # privileges that the non-admin control identity does not hold.
            if ($item.PSIsContainer) { $acl = [Security.AccessControl.DirectorySecurity]::new() }
            else { $acl = [Security.AccessControl.FileSecurity]::new() }
            $acl.SetSecurityDescriptorSddlForm($checkoutSddl, $accessSection)
            $item.SetAccessControl($acl)
            $observed = Get-Acl -LiteralPath $item.FullName -ErrorAction Stop
            # Windows may retain the AI history flag on a protected DACL. It
            # does not enable inheritance; every ACE must still match exactly.
            $observedSddl = $observed.GetSecurityDescriptorSddlForm($accessSection) -replace '^D:PAI(?=\()', 'D:P'
            if (-not $observed.AreAccessRulesProtected -or $observedSddl -ne $checkoutSddl) {
              throw "checkout child ACL does not match required explicit DACL: $($item.FullName)"
            }
          }
          # Re-read every child after all parent changes, not just the root.
          foreach ($entry in $items) {
            $item = Assert-CheckoutItem $entry.FullName
            $observed = Get-Acl -LiteralPath $item.FullName -ErrorAction Stop
            $observedSddl = $observed.GetSecurityDescriptorSddlForm($accessSection) -replace '^D:PAI(?=\()', 'D:P'
            if (-not $observed.AreAccessRulesProtected -or $observedSddl -ne $checkoutSddl) {
              throw "final checkout ACL verification failed: $($item.FullName)"
            }
          }

      - name: Run target tests under disposable SID
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          INPUT_RUNNER_NONCE: ${{ inputs.runner_nonce }}
        run: |
          $ErrorActionPreference = 'Stop'
          $trustedPython = 'C:\Program Files\Python312\python.exe'
          $controlSid = (Get-LocalUser -Name 'ac-runner' -ErrorAction Stop).SID.Value
          $targetName = "act-$($env:INPUT_RUNNER_NONCE.ToLowerInvariant())"
          $targetUser = Get-LocalUser -Name $targetName -ErrorAction Stop
          $targetSid = $targetUser.SID.Value
          $credentialFile = "C:\ProgramData\AgentController\ci-secrets\$($env:INPUT_RUNNER_NONCE.ToLowerInvariant()).txt"
          $password = (Get-Content -LiteralPath $credentialFile -Raw -ErrorAction Stop).TrimEnd([char[]]"`r`n")
          if ([string]::IsNullOrWhiteSpace($password) -or $password.Length -gt 256) {
            throw 'one-time disposable-target credential has invalid shape'
          }
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $credential = New-Object Management.Automation.PSCredential("$env:COMPUTERNAME\$targetName", $securePassword)
          Remove-Item -LiteralPath $credentialFile
          if (Test-Path -LiteralPath $credentialFile) { throw 'one-time credential file was not removed before target execution' }
          $password = $null

          $resultRoot = "C:\ProgramData\AgentController\ci-results\$($env:INPUT_RUNNER_NONCE.ToLowerInvariant())"
          New-Item -ItemType Directory -Force -Path $resultRoot | Out-Null
          & icacls.exe $resultRoot /inheritance:r /grant:r "*${controlSid}:(OI)(CI)(F)" "*${targetSid}:(OI)(CI)(M)" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'failed to prepare disposable target result directory' }

          $pathsToProbe = @($env:GITHUB_STEP_SUMMARY, $env:GITHUB_ENV, $env:GITHUB_PATH, (Join-Path $HOME 'ac-ci-control-write-probe.tmp'))
          $probeLiterals = ($pathsToProbe | ForEach-Object { "'" + $_.Replace("'", "''") + "'" }) -join ','
          $pythonLiteral = "'" + $trustedPython.Replace("'", "''") + "'"
          $workspaceLiteral = "'" + $env:GITHUB_WORKSPACE.Replace("'", "''") + "'"
          $targetSidLiteral = "'" + $targetSid.Replace("'", "''") + "'"
          $workspaceProbeLiteral = "'" + (Join-Path $env:GITHUB_WORKSPACE '.github\workflows\self-hosted-exact-head.yml').Replace("'", "''") + "'"
          $gitConfigProbeLiteral = "'" + (Join-Path $env:GITHUB_WORKSPACE '.git\config').Replace("'", "''") + "'"
          $command = @"
          `$ErrorActionPreference = 'Stop'
          if (([Security.Principal.WindowsIdentity]::GetCurrent().User.Value) -ne $targetSidLiteral) { exit 40 }
          `$forbiddenEnv = @(Get-ChildItem Env: | Where-Object { `$_.Name -like 'GITHUB_*' -or `$_.Name -eq 'GH_TOKEN' })
          if (`$forbiddenEnv.Count -ne 0) { exit 41 }
          foreach (`$probePath in @($probeLiterals)) {
            try {
              `$stream = [IO.File]::Open(`$probePath, [IO.FileMode]::OpenOrCreate, [IO.FileAccess]::Write, [IO.FileShare]::None)
              `$stream.Close()
              exit 42
            } catch [UnauthorizedAccessException] {
            } catch [IO.IOException] {
            }
          }
          try {
            `$stream = [IO.File]::Open($workspaceProbeLiteral, [IO.FileMode]::Open, [IO.FileAccess]::Write, [IO.FileShare]::Read)
            `$stream.Close()
            Write-Error 'target workspace write probe unexpectedly succeeded'
            exit 43
          } catch [UnauthorizedAccessException] {
          } catch {
            Write-Error "target workspace write probe did not prove ACL denial: `$(`$_.Exception.Message)"
            exit 44
          }
          try {
            `$stream = [IO.File]::Open($gitConfigProbeLiteral, [IO.FileMode]::Open, [IO.FileAccess]::Write, [IO.FileShare]::Read)
            `$stream.Close()
            Write-Error 'target .git/config write probe unexpectedly succeeded'
            exit 45
          } catch [UnauthorizedAccessException] {
          } catch {
            Write-Error "target .git/config write probe did not prove ACL denial: `$(`$_.Exception.Message)"
            exit 46
          }
          Set-Location -LiteralPath $workspaceLiteral
          & $pythonLiteral -B -m unittest discover -s tests -v
          if (`$LASTEXITCODE -ne 0) { exit 50 }
          & $pythonLiteral -B -m unittest discover -s tests -p 'test_antigravity_windows_junction.py' -v
          if (`$LASTEXITCODE -ne 0) { exit 51 }
          exit 0
          "@

          $stdout = Join-Path $resultRoot 'target-stdout.log'
          $stderr = Join-Path $resultRoot 'target-stderr.log'
          $process = Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -ArgumentList @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-Command', $command) `
            -Credential $credential -LoadUserProfile -UseNewEnvironment -WorkingDirectory $env:GITHUB_WORKSPACE `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -Wait

          if (Test-Path -LiteralPath $stdout) { Get-Content -LiteralPath $stdout | ForEach-Object { Write-Host $_ } }
          if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr | ForEach-Object { Write-Host $_ } }
          if ($process.ExitCode -ne 0) { throw "disposable target test process failed closed with exit $($process.ExitCode)" }

      - name: Verify trusted postconditions and revoke target access
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          INPUT_RUNNER_NONCE: ${{ inputs.runner_nonce }}
        run: |
          $ErrorActionPreference = 'Stop'
          $trustedGit = 'C:\Program Files\Git\cmd\git.exe'
          $targetName = "act-$($env:INPUT_RUNNER_NONCE.ToLowerInvariant())"
          $targetSid = (Get-LocalUser -Name $targetName -ErrorAction Stop).SID.Value

          function Get-TargetOwnedProcesses {
            $owned = @()
            foreach ($candidate in @(Get-CimInstance Win32_Process -ErrorAction Stop)) {
              $owner = Invoke-CimMethod -InputObject $candidate -MethodName GetOwnerSid -ErrorAction Stop
              if ($null -eq $owner -or $null -eq $owner.ReturnValue -or $owner.ReturnValue -ne 0 -or [string]::IsNullOrWhiteSpace($owner.Sid)) {
                throw "process ownership unresolved for PID $($candidate.ProcessId); GetOwnerSid ReturnValue=$($owner.ReturnValue)"
              }
              if ($owner.Sid -eq $targetSid) { $owned += $candidate }
            }
            return @($owned)
          }
          $quiescenceDeadline = [DateTime]::UtcNow.AddSeconds(10)
          do {
            $targetProcesses = @(Get-TargetOwnedProcesses)
            foreach ($targetProcess in $targetProcesses) {
              Stop-Process -Id $targetProcess.ProcessId -Force -ErrorAction Stop
            }
            if ($targetProcesses.Count -eq 0) { break }
            if ([DateTime]::UtcNow -ge $quiescenceDeadline) { throw 'target process termination exceeded bounded deadline' }
            Start-Sleep -Milliseconds 200
          } while ($true)
          $freshTargetProcesses = @(Get-TargetOwnedProcesses)
          if ($freshTargetProcesses.Count -ne 0) { throw 'target process quiescence could not be proven' }

          if (Test-Path -LiteralPath $env:GITHUB_STEP_SUMMARY) {
            $summaryBeforePass = Get-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Raw
            if ($summaryBeforePass -match 'SELF_HOSTED_EXACT_HEAD_PASS') {
              throw 'PASS evidence marker existed before trusted final evidence step'
            }
          }
          $credentialFile = "C:\ProgramData\AgentController\ci-secrets\$($env:INPUT_RUNNER_NONCE.ToLowerInvariant()).txt"
          if (Test-Path -LiteralPath $credentialFile) { throw 'one-time target credential unexpectedly remains after tests' }
          $targetTasks = @(Get-ScheduledTask -ErrorAction Stop | Where-Object {
            $_.Principal.UserId -eq $targetSid -or $_.Principal.UserId -eq "$env:COMPUTERNAME\$targetName"
          })
          if ($targetTasks.Count -ne 0) { throw 'target tests created scheduled-task persistence' }

          & icacls.exe $env:GITHUB_WORKSPACE /remove:g "*${targetSid}" /T /C | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'failed to revoke target checkout access' }
          & icacls.exe $env:GITHUB_WORKSPACE /deny "*${targetSid}:(OI)(CI)(F)" /T /C | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'failed to deny all residual target checkout access' }

          $head = (& $trustedGit rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'post-test git rev-parse failed' }
          if ($head -ne $env:INPUT_TARGET_SHA.ToLowerInvariant()) { throw 'HEAD changed during tests' }
          $dirty = @(& $trustedGit status --porcelain)
          if ($LASTEXITCODE -ne 0) { throw 'post-test git status failed' }
          if ($dirty.Count -ne 0) { throw 'working tree changed during tests' }

      - name: Revalidate current PR head after tests
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          INPUT_RUNNER_NONCE: ${{ inputs.runner_nonce }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetName = "act-$($env:INPUT_RUNNER_NONCE.ToLowerInvariant())"
          $targetSid = (Get-LocalUser -Name $targetName -ErrorAction Stop).SID.Value
          function Get-TargetOwnedProcesses {
            $owned = @()
            foreach ($candidate in @(Get-CimInstance Win32_Process -ErrorAction Stop)) {
              $owner = Invoke-CimMethod -InputObject $candidate -MethodName GetOwnerSid -ErrorAction Stop
              if ($null -eq $owner -or $null -eq $owner.ReturnValue -or $owner.ReturnValue -ne 0 -or [string]::IsNullOrWhiteSpace($owner.Sid)) {
                throw "process ownership unresolved for PID $($candidate.ProcessId); GetOwnerSid ReturnValue=$($owner.ReturnValue)"
              }
              if ($owner.Sid -eq $targetSid) { $owned += $candidate }
            }
            return @($owned)
          }
          $quiescenceDeadline = [DateTime]::UtcNow.AddSeconds(10)
          do {
            $targetProcesses = @(Get-TargetOwnedProcesses)
            foreach ($targetProcess in $targetProcesses) { Stop-Process -Id $targetProcess.ProcessId -Force -ErrorAction Stop }
            if ($targetProcesses.Count -eq 0) { break }
            if ([DateTime]::UtcNow -ge $quiescenceDeadline) { throw 'target process termination exceeded bounded deadline' }
            Start-Sleep -Milliseconds 200
          } while ($true)
          $freshTargetProcesses = @(Get-TargetOwnedProcesses)
          if ($freshTargetProcesses.Count -ne 0) { throw 'target process quiescence could not be proven' }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:EXPECTED_REPOSITORY/pulls/$env:INPUT_PR_NUMBER"
          $pr = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          if ($pr.state -ne 'open') { throw 'target PR is no longer open' }
          if ($null -eq $pr.head -or $null -eq $pr.head.repo) { throw 'post-test PR head repository evidence is missing' }
          if ($pr.head.repo.full_name -ne $env:EXPECTED_REPOSITORY) { throw 'post-test head repository drifted' }
          if ($pr.head.sha -ne $env:INPUT_TARGET_SHA.ToLowerInvariant()) { throw 'PR head changed during self-hosted verification' }

      - name: Record self-hosted evidence class
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& '{0}'"
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          INPUT_RUNNER_NONCE: ${{ inputs.runner_nonce }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetName = "act-$($env:INPUT_RUNNER_NONCE.ToLowerInvariant())"
          $targetSid = (Get-LocalUser -Name $targetName -ErrorAction Stop).SID.Value
          function Get-TargetOwnedProcesses {
            $owned = @()
            foreach ($candidate in @(Get-CimInstance Win32_Process -ErrorAction Stop)) {
              $owner = Invoke-CimMethod -InputObject $candidate -MethodName GetOwnerSid -ErrorAction Stop
              if ($null -eq $owner -or $null -eq $owner.ReturnValue -or $owner.ReturnValue -ne 0 -or [string]::IsNullOrWhiteSpace($owner.Sid)) {
                throw "process ownership unresolved for PID $($candidate.ProcessId); GetOwnerSid ReturnValue=$($owner.ReturnValue)"
              }
              if ($owner.Sid -eq $targetSid) { $owned += $candidate }
            }
            return @($owned)
          }
          $quiescenceDeadline = [DateTime]::UtcNow.AddSeconds(10)
          do {
            $targetProcesses = @(Get-TargetOwnedProcesses)
            foreach ($targetProcess in $targetProcesses) { Stop-Process -Id $targetProcess.ProcessId -Force -ErrorAction Stop }
            if ($targetProcesses.Count -eq 0) { break }
            if ([DateTime]::UtcNow -ge $quiescenceDeadline) { throw 'target process termination exceeded bounded deadline' }
            Start-Sleep -Milliseconds 200
          } while ($true)
          $freshTargetProcesses = @(Get-TargetOwnedProcesses)
          if ($freshTargetProcesses.Count -ne 0) { throw 'target process quiescence could not be proven' }
          "## SELF_HOSTED_EXACT_HEAD_PASS" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- PR: #$env:INPUT_PR_NUMBER" >> $env:GITHUB_STEP_SUMMARY
          "- exact head: ``$env:INPUT_TARGET_SHA``" >> $env:GITHUB_STEP_SUMMARY
          "- trusted control: local non-admin ac-runner SID" >> $env:GITHUB_STEP_SUMMARY
          "- target execution: disposable local act-$($env:INPUT_RUNNER_NONCE.ToLowerInvariant()) SID with isolated environment" >> $env:GITHUB_STEP_SUMMARY
          "- full unittest suite: PASS" >> $env:GITHUB_STEP_SUMMARY
          "- Windows junction regression: PASS" >> $env:GITHUB_STEP_SUMMARY
          "- evidence is not GITHUB_HOSTED_CI_PASS" >> $env:GITHUB_STEP_SUMMARY
          "- Ready / merge remain human-final" >> $env:GITHUB_STEP_SUMMARY
