name: cloudflare-command-proof

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-command-proof.yml"

permissions:
  contents: read

jobs:
  prove-command:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare_poc
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up exact Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - name: Install exact pinned Wrangler from generated retained lock
        run: |
          test ! -e package-lock.json
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          ./node_modules/.bin/wrangler --version
          actual_version="$(node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("node_modules/wrangler/package.json","utf8")); process.stdout.write(p.version)')"
          test "$actual_version" = "4.125.0"
      - name: Capture exact deploy help evidence
        run: |
          ./node_modules/.bin/wrangler deploy --help > ../wrangler-deploy-help.txt
          grep -F -- '--no-bundle' ../wrangler-deploy-help.txt
          grep -F -- '--upload-source-maps' ../wrangler-deploy-help.txt
          grep -F -- '--dry-run' ../wrangler-deploy-help.txt
      - name: Create deterministic prebuilt proof fixture
        run: |
          rm -rf ../command-proof
          mkdir -p ../command-proof
          cat > ../command-proof/index.js <<'JS'
          export default { async fetch() { return new Response("command-proof"); } };
          JS
          cat > ../command-proof/wrangler.jsonc <<'JSON'
          {"name":"agent-controller-command-proof","main":"./index.js","compatibility_date":"2026-08-25","no_bundle":true,"find_additional_modules":false,"upload_source_maps":false}
          JSON
          sha256sum ../command-proof/index.js ../command-proof/wrangler.jsonc
      - name: Prove global explicit false syntax and no-bundle dry-run
        run: |
          expected="$(sha256sum ../command-proof/index.js | awk '{print $1}')"
          rm -rf ../command-proof-out
          ./node_modules/.bin/wrangler \
            --experimental-provision=false \
            --experimental-auto-create=false \
            deploy \
            --dry-run \
            --no-bundle \
            --config ../command-proof/wrangler.jsonc \
            --outdir ../command-proof-out
          test ! -e ../command-proof/.wrangler/deploy/config.json
          actual="$(sha256sum ../command-proof-out/index.js | awk '{print $1}')"
          test "$expected" = "$actual"
          js_count="$(find ../command-proof-out -type f -name '*.js' | wc -l | tr -d ' ')"
          test "$js_count" = "1"
          printf 'PROVEN_GLOBAL_FLAGS=--experimental-provision=false --experimental-auto-create=false\n'
          printf 'PROVEN_DEPLOY_FLAGS=--dry-run --no-bundle\n'
          printf 'WORKER_SHA256=%s\n' "$actual"
      - name: Reject prohibited command surfaces from executable run blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("../.github/workflows/cloudflare-command-proof.yml").read_text(encoding="utf-8")
          prohibited = [
              "wrangler " + "login",
              "--" + "temporary",
              "--" + "route ",
              "--" + "routes ",
              "--" + "domain ",
              "--" + "secrets-file",
              "wrangler " + "secret",
          ]
          lines = text.splitlines()
          proof_start = lines.index("      - name: Prove global explicit false syntax and no-bundle dry-run")
          reject_start = lines.index("      - name: Reject prohibited command surfaces from executable run blocks")
          executable = "\n".join(lines[proof_start:reject_start])
          for token in prohibited:
              if token in executable:
                  raise SystemExit("PROHIBITED_COMMAND_SURFACE:" + token)
          if executable.count("deploy ") != 1:
              raise SystemExit("UNEXPECTED_DEPLOY_COMMAND_COUNT")
          for required in (
              "--dry-run",
              "--no-bundle",
              "--experimental-provision=false",
              "--experimental-auto-create=false",
          ):
              if required not in executable:
                  raise SystemExit("REQUIRED_FLAG_MISSING:" + required)
          print("effect-free deploy command count: 1")
          PY
